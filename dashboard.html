<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nina Sport | Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://mbllpmydlewmdzcnxpcq.supabase.co";
const SUPABASE_KEY = "sb_publishable_SQ--Ml1E";

window.supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

console.log("SUPABASE CLIENT OK");
</script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#0f0f14;
  color:white;
}

header{
  background:linear-gradient(135deg,#ff4d8d,#ff9fc4);
  padding:20px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

.menu{
  display:flex;
  justify-content:space-around;
  background:#16161d;
  padding:10px;
}

.menu a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.container{
  padding:15px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
}

.card{
  background:#1c1c25;
  padding:15px;
  border-radius:15px;
  box-shadow:0 0 10px rgba(255,77,141,0.3);
  text-align:center;
}

.card h2{
  color:#ff77a8;
  margin:5px 0;
}

.section{
  margin-top:25px;
  background:#1c1c25;
  padding:15px;
  border-radius:15px;
  box-shadow:0 0 10px rgba(255,77,141,0.3);
}

canvas{
  margin-top:10px;
}
</style>
</head>

<body>

<header>💖 NINA SPORT · DASHBOARD</header>

<div class="menu">
  <a href="admin.html">Clientes</a>
  <a href="admin-medidas.html">Medidas</a>
  <a href="admin-rutinas.html">Rutinas</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="#" onclick="logout()">Salir</a>
</div>

<div class="container">

  <div class="cards">

    <div class="card">
      <h3>👥 Clientes</h3>
      <h2 id="totalClientes">0</h2>
    </div>

    <div class="card">
      <h3>🔥 Racha total</h3>
      <h2 id="totalRacha">0</h2>
    </div>

    <div class="card">
      <h3>📅 Activos hoy</h3>
      <h2 id="activosHoy">0</h2>
    </div>

  </div>

  <div class="section">
    <h3>📈 Progreso promedio</h3>
    <canvas id="pesoChart"></canvas>
  </div>

  <div class="section">
    <h3>🔥 Rachas</h3>
    <canvas id="rachaChart"></canvas>
  </div>

  <div class="section">
    <h3>🆕 Últimos clientes</h3>
    <ul id="listaClientes"></ul>
  </div>

</div>


<script src="js/auth.js"></script>

<script>

/**********************
VERIFICAR SESION
**********************/
async function verificarSesionDashboard(){

  const client = window.supabaseClient;

  if(!client){
    location.href="login.html";
    return;
  }

  const { data } = await client.auth.getSession();

  if(!data.session){
    location.href="login.html";
    return;
  }

  const user = data.session.user;

  const { data: perfil } = await client
  .from("perfiles")
  .select("*")
  .eq("id", user.id)
  .single();

  if(!perfil){
    location.href="login.html";
    return;
  }

  if(perfil.rol !== "admin"){
    location.href="cliente-dashboard.html";
    return;
  }

  console.log("ADMIN OK");

  cargarDashboard();
}


/**********************
CARGAR DASHBOARD
**********************/
function cargarDashboard(){

  const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

  const clientes = usuarios.filter(u=>u.rol==="cliente");

  document.getElementById("totalClientes").textContent = clientes.length;

  let totalRacha=0;
  let activosHoy=0;

  const hoy=new Date().toDateString();

  clientes.forEach(u=>{

    if(u.racha?.dias)
      totalRacha+=u.racha.dias;

    if(u.racha?.ultima===hoy)
      activosHoy++;

  });

  document.getElementById("totalRacha").textContent=totalRacha;
  document.getElementById("activosHoy").textContent=activosHoy;


  /* LISTA */
  const lista=document.getElementById("listaClientes");
  lista.innerHTML="";

  clientes.slice(-5).reverse().forEach(u=>{

    const li=document.createElement("li");
    li.textContent="👤 "+u.nombre;
    lista.appendChild(li);

  });


  /* GRAFICA PESO */
  const labels=[];
  const dataPeso=[];

  clientes.forEach(u=>{

    const historial=JSON.parse(localStorage.getItem("medidas_"+u.user))||[];

    historial.forEach(m=>{

      labels.push(m.mes);
      dataPeso.push(m.peso);

    });

  });


  new Chart(document.getElementById("pesoChart"),{

    type:"line",

    data:{
      labels,
      datasets:[{
        label:"Peso",
        data:dataPeso,
        borderWidth:2,
        tension:0.4
      }]
    }

  });


  /* GRAFICA RACHAS */

  new Chart(document.getElementById("rachaChart"),{

    type:"bar",

    data:{
      labels:clientes.map(u=>u.nombre),
      datasets:[{
        label:"Racha",
        data:clientes.map(u=>u.racha?.dias||0)
      }]
    }

  });

}


/**********************
LOGOUT
**********************/
async function logout(){

  await window.supabaseClient.auth.signOut();

  location.href="login.html";

}


/**********************
INICIAR
**********************/
verificarSesionDashboard();

</script>


</body>
</html>
