<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nina Sport | Rutinas</title>

<link rel="stylesheet" href="css/styles.css">
<meta name="theme-color" content="#ff4d6d">
</head>

<body>

<header class="header">
  <h1>🏋️ Nina Sport</h1>
  <p>Asignar rutina</p>
  <button onclick="location.href='admin-clientes.html'">⬅ Volver</button>
</header>

<main>

<!-- ======================
     CLIENTA + MES
====================== -->
<section class="card">
  <h3>Seleccionar clienta</h3>
  <select id="clienteSelect"></select>

  <label>Mes</label>
  <input type="month" id="mes">
</section>

<!-- ======================
     SEMANA
====================== -->
<section class="card">
  <h3>Semana</h3>

  <select id="semanaSelect">
    <option value="semana1">Semana 1</option>
    <option value="semana2">Semana 2</option>
    <option value="semana3">Semana 3</option>
    <option value="semana4">Semana 4</option>
  </select>

  <p id="textoSemana" style="margin-top:8px;font-weight:bold;"></p>
</section>

<!-- ======================
     PANEL RUTINA
====================== -->
<section id="rutinaPanel"></section>

<!-- ======================
     GUARDAR
====================== -->
<section class="card" style="text-align:center">
  <button class="btn-principal" onclick="guardarRutina()">
    💾 Guardar rutina
  </button>
</section>

</main>

<script src="js/auth.js"></script>
<script>protegerPagina(['admin']);</script>
<script src="js/admin-rutinas.js"></script>

</body>
</html>
